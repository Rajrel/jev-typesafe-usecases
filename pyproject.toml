[project]
name = "jev-typesafe-usecases"
version = "0.1.0"
description = "Plain-language Jev / TypeSafe use-case notebooks for a sample shop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-typesafe[experimental]>=0.0.1a1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_examples"]
